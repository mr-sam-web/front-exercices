<!DOCTYPE html>
<html lang="FR">
    <head>
        <meta charset="UTF-8">
        <title>Carte Citation</title>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <div class="card">
            <article>
                <div class="avatar">
                    <p>NH</p>
                </div>

                <blockquote class="citation-wrapper">
                    <p>Tout ce que l'esprit conçoit et croit, il peut l'obtenir.</p>
                    <footer class="footer">
                        <p>Napoleon Hill <cite>Think and grow rich</cite></p>

                        <div class="badge">
                            <p>✓ Vérifié</p>
                        </div>
                    </footer>
                </blockquote>
            </article>

            <a class="btn" href="https://mr-sam-bento.webflow.io/" target="_blank">
                <p>Voir le site →</p>

                <div class="btn-line"></div>
            </a>
        </div>
    </body>
</html>
