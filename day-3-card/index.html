<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <title>Carte Citation</title>
        <link rel="stylesheet" href="styles.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>

    <body>
        <div class="card">
            <article>
                <div class="avatar">
                    <p>SV</p>
                </div>

                <blockquote class="citation-wrapper">
                    <p>C'est la meilleure expérience de ma vie. Ce film était extraordiraire</p>
                </blockquote>
                <footer class="footer">
                        <p>Solange Véra <span>Critique cinéma, <cite>LE CINEMA AUTREMENT</cite></span></p>

                        <div class="badge">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg>
                            <p>Vérifié</p>
                        </div>
                    </footer>
            </article>

            <a class="btn" href="https://mr-sam-bento.webflow.io/" target="_blank">
                <p>Voir le site →</p>

                <div class="btn-line" aria-hidden="true"></div>
            </a>
        </div>
    </body>
</html>
