<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Freelance Card</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <div class="card">
            <div class="header">
                <div class="avatar">
                    <p>MS</p>
                </div>
                <div class="info">
                    <h1>Mr Sam</h1>
                    <p>Webflow Creative Dev</p>
                </div>
            </div>

            <p class="description">I'm a webflow developer and I make websites for agencies and services providers. I also work as a subcontractor for other agencies or developers</p>

            <ul>
                <li>Webflow</li>
                <li>GSAP</li>
                <li>Figma</li>
                <li>Claude AI</li>
                <li>Custom code</li>
            </ul>

            <div class="avaibility">
                <div class="dot"></div>
                <p>Available for your next website</p>
            </div>

            <a class="button" href="#">
                <p>Contact →</p>
            </a>
        </div>
    </body>
</html>
